<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta content="Loft Clicker 2" property="og:title" />
    <meta
      content="my favorite part was when he said Its loftin time. and lofted all over the place"
      property="og:description"
    />
    <meta
      content="https://github.com/acompleteidiot/loft-clicker-2/blob/main/src/"
      property="og:url"
    />
    <meta content="#408000" data-react-helmet="true" name="theme-color" />
    <meta
      name="keywords"
      content="loft, clicker, 2, loft tower 2, loft tower, softrooms, bingus"
    />
    <meta name="color-scheme" content="dark only" />
    <title>Loft Clicker 2</title>
    <link rel="icon" type="image/x-icon" href="img/loftIcon.png?raw=true" />
    <link rel="stylesheet" href="style.css" />
    <!--
  <link href="style.css" rel="stylesheet" type="text/css" /> 
  --></head>
  <!-- cringelord -->
</html>
<body>
  <div id="containerContainer">
    <div
      id="loftContainer"
      style="position: relative; width: 50%; margin: auto"
    >
      <button class="imgButton" id="loftButton" onclick="loftClick()">
        <img src="img/loftButton.png?raw=true" />
      </button>
      <p>
        <span id="loftClicks">0</span> loft clicks <br />
        <span id="loftClickspClick">0</span> loft clicks per click
        <span id="loftPetsTracker" style="display: none"
          ><br /><span id="loftPets">0</span> loft pet<span id="loftPetsPlural"
            >s</span
          ></span
        >
        <span id="loftPetsCostTracker" style="display: none"
          ><br />
          next loft pet costs <span id="loftPetCost">0</span> loft clicks</span
        >
      </p>
      <button class="button" id="resetButton" onclick="resetButton()">
        Reset Game
      </button>
      <button class="button" id="saveButton" onclick="save()">Save Game</button>
      <div id="loftBuildings">
        <button
          class="button"
          id="loftPet"
          style="opacity: 0"
          onclick="buyBuilding(1)"
        >
          Buy Loft Pet
        </button>
      </div>
    </div>
    <div id="woftContainer" style="position: relative; width: 50%">
      <button class="imgButton" id="woftButton" onclick="woftClick()">
        <img src="img/woftButton.png?raw=true" />
      </button>
    </div>
  </div>

  <!-- scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="scripts/break_eternity.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/loft.js"></script>
</body>
